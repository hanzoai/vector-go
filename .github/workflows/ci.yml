name: Go Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - name: Get
        run: go get ./...

      - name: Build
        run: go build ./...

      - name: Run Tests (unit, no containers)
        # `-short` causes the qdrant_test/* integration tests to skip when
        # there is no Qdrant container available on the runner. The matching
        # integration job (when added) should run without -short against a
        # Qdrant service container.
        run: go test -short -v ./...
